# Render blueprint for the MedConsult API.
#
# Render runs the Express server, which Netlify cannot: the app holds open
# Socket.io WebSocket connections for chat and live notifications, and a
# serverless function cannot do that.
#
# To use: Render dashboard -> New -> Blueprint -> point at this repo.
# Secrets are marked sync:false so they are never committed; Render prompts
# for them once at creation and stores them encrypted.

services:
  - type: web
    name: medconsult-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start

    # Render restarts the service if this stops returning 200. It is also the
    # endpoint to point a keep-alive cron at (see the note on cold starts).
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT; server.js already reads process.env.PORT.

      # --- required -------------------------------------------------------
      - key: MONGO_URI
        sync: false          # mongodb+srv://... from MongoDB Atlas
      - key: JWT_SECRET
        sync: false          # generate: node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"

      # Must include the Netlify site origin or every browser request is
      # blocked by CORS. No trailing slash. Comma-separated for several.
      - key: CORS_ORIGINS
        sync: false          # e.g. https://medconsult.netlify.app
      - key: CLIENT_URL
        sync: false          # same origin; used to build links inside emails

      # --- optional, each degrades gracefully if left unset ---------------
      - key: GEMINI_API_KEY
        sync: false          # without it the rule-based symptom engine answers
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false          # without it uploads fall back to local disk,
      - key: CLOUDINARY_API_KEY
        sync: false          # which on Render is EPHEMERAL - files vanish on
      - key: CLOUDINARY_API_SECRET
        sync: false          # redeploy. Configure this for real use.
      - key: AGORA_APP_ID
        sync: false          # without it video falls back to a Jitsi iframe
      - key: AGORA_APP_CERTIFICATE
        sync: false
      - key: WHATSAPP_PROVIDER
        value: callmebot
      - key: CALLMEBOT_ENABLED
        value: "true"
      - key: CALLMEBOT_API_KEY
        sync: false

      # Rate limiting cannot be disabled in production regardless of this
      # value - see server/src/config/env.js - but keep it explicit.
      - key: DISABLE_RATE_LIMITS
        value: "false"
