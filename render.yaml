# Render blueprint for MedConsult: one web service serving both the React
# client and the Express/Socket.io API from the same origin.
#
# One service means one URL, no CORS configuration, and Socket.io connecting
# straight back to the page's own origin. MongoDB lives on Atlas (free M0).
#
# To use: Render dashboard -> New -> Blueprint -> point at this repo.
# Secrets are marked sync:false so they are never committed; Render prompts
# for them once at creation and stores them encrypted.

services:
  - type: web
    name: medconsult
    runtime: node
    plan: free
    # Vite is a devDependency, and NODE_ENV=production would otherwise make
    # npm skip it, so the client install includes dev deps explicitly.
    buildCommand: cd client && npm ci --include=dev && npm run build && cd ../server && npm ci --omit=dev
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Render injects PORT and RENDER_EXTERNAL_URL; the server reads both,
      # so the service's own URL is allowed by CORS without configuring it.

      # --- required -------------------------------------------------------
      - key: MONGO_URI
        sync: false          # mongodb+srv://... from MongoDB Atlas
      - key: JWT_SECRET
        generateValue: true  # Render generates a strong random value

      # --- AI -------------------------------------------------------------
      - key: GEMINI_API_KEY
        sync: false          # without it the rule-based symptom engine answers
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: GEMINI_TIMEOUT_MS
        value: "12000"

      # --- demo-friendly limits (shared demo accounts at a showcase) -------
      - key: API_REQUESTS_PER_15MIN
        value: "2000"
      - key: AUTH_ATTEMPTS_PER_15MIN
        value: "20"
      - key: SYMPTOM_CHECKS_PER_HOUR
        value: "60"

      # --- optional, each degrades gracefully if left unset ---------------
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false          # without it, uploads are stored in MongoDB GridFS
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: AGORA_APP_ID
        sync: false          # without it video falls back to a Jitsi iframe
      - key: AGORA_APP_CERTIFICATE
        sync: false
      - key: WHATSAPP_PROVIDER
        value: callmebot
      - key: CALLMEBOT_ENABLED
        value: "true"
